<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happ - Tu Salud</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Driver.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css" />
    <link rel="stylesheet" href="styles.css">
</head>

<body>


    <!-- Phone Mockup Container -->
    <div class="phone-mockup">
        <!-- Physical Side Buttons -->
        <div class="phone-btn-left action-btn"></div>
        <div class="phone-btn-left vol-up-btn"></div>
        <div class="phone-btn-left vol-down-btn"></div>
        <div class="phone-btn-right power-btn"></div>

        <!-- Phone Screen Glass -->
        <div class="phone-screen" id="app-container">

            <!-- iPhone Status Bar -->
            <div class="status-bar">
                <div class="status-time" id="status-clock">09:41</div>
                <div class="dynamic-island">
                    <div class="island-camera"></div>
                    <div class="island-sensor"></div>
                </div>
                <div class="status-icons">
                    <!-- Signal -->
                    <svg class="status-icon" width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
                        <rect x="0" y="8" width="2.5" height="4" rx="0.5"/>
                        <rect x="4" y="5.5" width="2.5" height="6.5" rx="0.5"/>
                        <rect x="8" y="3" width="2.5" height="9" rx="0.5"/>
                        <rect x="12" y="0.5" width="2.5" height="11.5" rx="0.5"/>
                    </svg>
                    <!-- Wifi -->
                    <svg class="status-icon" width="15" height="12" viewBox="0 0 16 12" fill="currentColor">
                        <path d="M8 9.5C8.8 9.5 9.5 8.8 9.5 8C9.5 7.2 8.8 6.5 8 6.5C7.2 6.5 6.5 7.2 6.5 8C6.5 8.8 7.2 9.5 8 9.5Z" />
                        <path d="M8 3.5C10.2 3.5 12.2 4.4 13.7 5.9L15.1 4.5C13.2 2.6 10.7 1.5 8 1.5C5.3 1.5 2.8 2.6 0.9 4.5L2.3 5.9C3.8 4.4 5.8 3.5 8 3.5Z" />
                        <path d="M8 0C11.3 0 14.3 1.3 16.5 3.5L15.1 4.9C13.2 3 10.7 1.8 8 1.8C5.3 1.8 2.8 3 0.9 4.9L-0.5 3.5C1.7 1.3 4.7 0 8 0Z" />
                    </svg>
                    <!-- Battery -->
                    <div class="battery-icon">
                        <div class="battery-level"></div>
                    </div>
                </div>
            </div>

            <!-- Mobile App Content -->
            <div class="mobile-container">
                <header>
                    <div class="user-greeting-container">
                        <h1 class="user-greeting">Hola Ignacio 👋</h1>
                    </div>
                    <div class="header-actions">
                        <div class="help-btn" id="restart-tour" title="Reiniciar tutorial">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                                <line x1="12" y1="17" x2="12.01" y2="17"></line>
                            </svg>
                            <div class="help-tooltip" id="help-tooltip">Accede al instructivo cuando quieras</div>
                        </div>
                        <div class="settings-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </div>
                    </div>
                </header>

                <section id="results-operative-card" class="results-card">
                    <div class="results-icon-container">
                        <span class="new-badge">Nuevo</span>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00a0e9" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <path d="m9 15 2 2 4-4"></path>
                        </svg>
                    </div>
                    <div class="results-info">
                        <h3>Resultados de operativo</h3>
                        <p>Tus resultados de salud ya están disponibles.</p>
                    </div>
                    <div class="results-arrow">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                </section>

                <section class="hero-card">
                    <div class="hero-content">
                        <div class="hero-brand">
                            <img src="assets/logo_happ.png" alt="Happ - Tu salud en tu mano" class="hero-logo-img">
                        </div>
                        <h2 class="hero-headline">Descubre lo que hacemos por ti</h2>
                        <a href="#" class="hero-link">Ver más</a>
                    </div>
                    <div class="hero-image">
                        <img src="assets/doctor_user.png" alt="Doctor Happ">
                    </div>
                </section>

                <div class="carousel-dots">
                    <div class="dot active"></div>
                    <div class="dot small"></div>
                </div>

                <main class="main-actions">
                    <!-- TARGET CARD FOR DRIVER.JS -->
                    <div class="action-card" id="upload-recipe-card">
                        <img src="assets/receta.png" alt="Receta" style="width: 52px; height: 52px; object-fit: contain;">
                        <span>Cotizar medicamentos</span>
                    </div>
                    <div class="action-card" id="upload-exam-card">
                        <img src="assets/examen.png" alt="Examen" style="width: 52px; height: 52px; object-fit: contain;">
                        <span>Mis resultados</span>
                    </div>
                </main>

                <div class="action-card" id="assistant-card" style="width: 100%; margin-top: 12px;">
                    <img src="assets/asistente.png" alt="Asistente" style="width: 52px; height: 52px; object-fit: contain;">
                    <span>Asistente Happ</span>
                </div>
            </div>

            <!-- Bottom Navigation inside Screen -->
            <nav class="bottom-nav">
                <div class="nav-item active">
                    <img src="assets/home.jpg" alt="Home" class="nav-icon-img">
                    <span>Home</span>
                </div>
                <div class="nav-item" id="nav-docs">
                    <img src="assets/docs.png" alt="Docs" class="nav-icon-img">
                    <span>Documentos</span>
                </div>
                <div class="nav-item" id="nav-health">
                    <img src="assets/salud.png" alt="Salud" class="nav-icon-img">
                    <span>Mi salud</span>
                </div>
                <div class="nav-item">
                    <img src="assets/ia.png" alt="Happ IA" class="nav-icon-img">
                    <span>Happ IA</span>
                </div>
                <!-- iOS Home Bar Indicator -->
                <div class="home-indicator"></div>
            </nav>

            <!-- Floating Robot Assistant Bot -->
            <div class="floating-bot-widget" id="floating-bot" title="Asistente Happ">
                <img src="assets/floating_bot.png" alt="Bot Happ Assistant" class="floating-bot-img">
            </div>
        </div>
    </div>


    <!-- Scripts -->
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>
    <script>
        let currentProfile = 'masivo';

        // Base steps configuration
        const getSteps = (profile) => {
            const baseSteps = [
                {
                    element: '#upload-recipe-card',
                    popover: {
                        title: '📌 ¡Ahorra en remedios!',
                        description: 'Aquí puedes cotizar y buscar la opción más barata en muchas farmacias 🛒 📉',
                        side: "bottom",
                        align: 'center'
                    }
                },
                {
                    element: '#upload-exam-card',
                    popover: {
                        title: '🩺 ¡Salud en simple!',
                        description: 'Revisa tus resultados, sube exámenes y sigue tu evolución sin enredos. ¡Tu bienestar es prioridad! 📊',
                        side: "bottom",
                        align: 'center'
                    }
                },
                {
                    element: '#floating-bot',
                    popover: {
                        title: '🚀 ¡Saca el máximo provecho a tu plan!',
                        description: 'Te ayudamos a entender tu cobertura de salud para que nunca pagues de más.',
                        side: "top",
                        align: 'end'
                    }
                },
                {
                    element: '#nav-docs',
                    popover: {
                        title: '📁 Todo en un lugar',
                        description: 'Tu carpeta medica digital, ordenada y segura. Todo en un clic.',
                        side: "top",
                        align: 'center'
                    }
                },
                {
                    element: '#nav-health',
                    popover: {
                        title: '❤️ Toma el control',
                        description: 'Sigue tu evolución con gráficos simples. ¡Tu bienestar es prioridad! 📊',
                        side: "top",
                        align: 'center'
                    }
                }
            ];

            const finalStepMasivo = {
                popover: {
                    title: '¡Ya estás listo! 🎉',
                    description: 'Disfruta de una salud más inteligente, eficiente y accesible. ¡Bienvenido a Happ! 🚀',
                    side: "top",
                    align: 'center'
                }
            };

            const finalStepOperativo = {
                popover: {
                    title: '✅ ¡Resultados listos!',
                    description: 'Los resultados de tu operativo de salud ya fueron procesados y están disponibles para que los revises.',
                    side: "top",
                    align: 'center',
                    doneBtnText: 'Ver resultados',
                    prevBtnText: 'Ver después'
                }
            };

            return [...baseSteps, profile === 'masivo' ? finalStepMasivo : finalStepOperativo];
        };

        let tourFinished = false;

        const showResultsModal = () => {
            const driver = window.driver.js.driver({
                allowClose: true,
                popoverOffset: 12,
                popoverClass: 'happ-pro-popover',
                onDestroyed: () => {
                    // Mostrar la card al cerrar el modal
                    document.getElementById('results-operative-card').classList.add('visible');
                },
                steps: [
                    {
                        popover: {
                            title: '✅ ¡Resultados listos!',
                            description: 'Los resultados de tu operativo de salud ya fueron procesados y están disponibles para que los revises.',
                            side: "top",
                            align: 'center',
                            doneBtnText: 'Ver resultados',
                            prevBtnText: 'Ver después'
                        }
                    }
                ]
            });
            driver.drive();
        };

        const configDriver = (profile) => {
            tourFinished = false;
            // Remover cualquier efecto previo al iniciar
            const helpBtn = document.getElementById('restart-tour');
            const helpTooltip = document.getElementById('help-tooltip');
            const resultsCard = document.getElementById('results-operative-card');

            helpBtn.classList.remove('glow-active');
            helpTooltip.classList.remove('show');
            resultsCard.classList.remove('visible');

            return window.driver.js.driver({
                showProgress: true,
                animate: true,
                allowClose: true,
                stagePadding: 8,
                popoverOffset: 12,
                popoverClass: 'happ-pro-popover',
                nextBtnText: 'Siguiente',
                prevBtnText: 'Anterior',
                doneBtnText: profile === 'masivo' ? 'Listo' : 'Ver resultados',
                onHighlightStarted: (element, step, { state }) => {
                    // Si llegamos al último paso, marcamos como finalizado
                    if (state.activeIndex === getSteps(profile).length - 1) {
                        tourFinished = true;
                    }
                },
                onDestroyed: () => {
                    // Si el tour se cierra (por completar o por la X)
                    if (!tourFinished || currentProfile === 'masivo') {
                        // Activar brillo y tooltip
                        helpBtn.classList.add('glow-active');
                        helpTooltip.classList.add('show');

                        // Remover tooltip después de 4 segundos, pero dejar el brillo
                        setTimeout(() => {
                            helpTooltip.classList.remove('show');
                        }, 4000);
                    }

                    // Si termina el tour normalmente en operativo, mostrar la card
                    if (currentProfile === 'operativo' && tourFinished) {
                        resultsCard.classList.add('visible');
                    }

                    // Si es operativo y NO terminó el tour (lo cerró antes), forzamos el modal de resultados
                    if (currentProfile === 'operativo' && !tourFinished) {
                        setTimeout(showResultsModal, 300);
                    }
                },
                steps: getSteps(profile)
            });
        };

        let driverObj = configDriver(currentProfile);

        // Trigger tour on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                driverObj.drive();
            }, 1000);
        });

        // Restart tour on button click
        document.getElementById('restart-tour').addEventListener('click', () => {
            driverObj.drive();
        });



        // Actualizar reloj de la barra de estado
        const updateClock = () => {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const clockEl = document.getElementById('status-clock');
            if (clockEl) {
                clockEl.textContent = `${hours}:${minutes}`;
            }
        };
        updateClock();
        setInterval(updateClock, 10000);
    </script>
</body>

</html>
